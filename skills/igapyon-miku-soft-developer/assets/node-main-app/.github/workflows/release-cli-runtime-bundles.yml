name: Release CLI/runtime bundles

# miku-soft Node release assets are created when a GitHub Release is published.
# Create or choose a v* tag in the GitHub Release UI; this workflow builds from
# that tag and attaches prepared assets to the same release.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release-cli-runtime-bundles:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate release tag
        env:
          TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          case "${TAG_NAME}" in
            v*) ;;
            *)
              echo "Release tag must start with v: ${TAG_NAME}" >&2
              exit 1
              ;;
          esac

          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.2." >&2
              exit 1
              ;;
          esac

          echo "RELEASE_VERSION=${VERSION}" >> "${GITHUB_ENV}"

      - name: Build
        run: npm run build

      - name: Build release bundles
        run: npm run build:bundle

      - name: Verify release bundle files
        run: |
          set -euo pipefail
          test -s bundle/__PRODUCT_NAME__.mjs
          test -s bundle/__PRODUCT_NAME__-runtime.mjs
          test -s bundle/__PRODUCT_NAME__-sources.tgz

      - name: Smoke test CLI bundle
        run: npm run smoke:bundle

      - name: Smoke test runtime bundle
        run: npm run smoke:runtime

      - name: Prepare release assets
        run: |
          set -euo pipefail
          mkdir -p release-assets
          cp bundle/__PRODUCT_NAME__.mjs "release-assets/__PRODUCT_NAME__-${RELEASE_VERSION}.mjs"
          cp bundle/__PRODUCT_NAME__-runtime.mjs "release-assets/__PRODUCT_NAME__-runtime-${RELEASE_VERSION}.mjs"
          cp bundle/__PRODUCT_NAME__-sources.tgz "release-assets/__PRODUCT_NAME__-sources-${RELEASE_VERSION}.tgz"

      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: release-assets/*
          overwrite_files: true
