name: Build And Upload Release Asset

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag_name:
        description: "GitHub Release tag to attach the skill bundle zip to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    if: startsWith(github.event.release.tag_name || github.event.inputs.tag_name, 'v')

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref }}

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Build release bundle
        # npm test verifies every CLI artifact declared in package.json from
        # an isolated install; the bundle build rejects missing declared files.
        run: npm run build

      - name: Verify release tag version
        id: release_version
        shell: bash
        env:
          TAG_NAME: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG_NAME#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "${VERSION}" in
            "${PACKAGE_VERSION}"|"${PACKAGE_VERSION}".*) ;;
            *)
              echo "Release tag version (${VERSION}) must match package.json version (${PACKAGE_VERSION}) or add a dot suffix such as ${PACKAGE_VERSION}.2." >&2
              exit 1
              ;;
          esac
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "package_version=${PACKAGE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Prepare release zip
        id: prepare_zip
        shell: bash
        env:
          PACKAGE_VERSION: ${{ steps.release_version.outputs.package_version }}
          RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: |
          set -euo pipefail
          source_zip="bundle/igapyon-__REPO_NAME__-${PACKAGE_VERSION}.zip"
          target_zip="release-assets/igapyon-__REPO_NAME__-${RELEASE_VERSION}.zip"
          if [[ ! -s "${source_zip}" ]]; then
            echo "release zip not found or empty: ${source_zip}" >&2
            exit 1
          fi
          mkdir -p release-assets
          cp "${source_zip}" "${target_zip}"
          echo "zip_path=${target_zip}" >> "$GITHUB_OUTPUT"

      - name: Setup minimum supported Node.js for artifact smoke
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Smoke-test staged release zip on minimum supported Node.js
        env:
          STAGED_ZIP: ${{ steps.prepare_zip.outputs.zip_path }}
        run: node scripts/verify-release-zip.mjs "$STAGED_ZIP"

      - name: Upload zip to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.event.release.tag_name || github.ref_name }}
          files: ${{ steps.prepare_zip.outputs.zip_path }}
          draft: false
          prerelease: false
