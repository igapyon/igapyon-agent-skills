name: Miku SCM Contract

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select:
    name: Select changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      required: ${{ steps.select.outputs.required }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test scripts/contract-ci.test.mjs
      - uses: actions/github-script@v8
        id: select
        with:
          script: |
            await require('./.github/scripts/contract-ci.cjs').select(
              { github, context, core }, 'igapyon-miku-scm');

  contract:
    needs: select
    if: needs.select.outputs.required == 'true'
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: mvn --version
      - run: npm run test:miku-scm:full
      - run: node skills/igapyon-miku-scm/scripts/miku-scm-workflow-contracts.mjs --check
      - run: git diff --check

  required:
    name: Miku SCM required
    if: always()
    needs: [select, contract]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v8
        env:
          CONTRACT_NEEDS: ${{ toJSON(needs) }}
        with:
          script: |
            require('./.github/scripts/contract-ci.cjs').assertGate(
              JSON.parse(process.env.CONTRACT_NEEDS));
