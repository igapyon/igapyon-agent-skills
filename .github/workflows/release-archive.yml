name: Release archive

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release-archive:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build release archive
        run: mvn clean package

      - name: Check release archive contents
        run: node scripts/check-release-archive.mjs target/igapyon-agent-skills-*.zip

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: target/igapyon-agent-skills-*.zip
          fail_on_unmatched_files: true
