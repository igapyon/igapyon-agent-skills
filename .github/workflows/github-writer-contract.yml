name: GitHub Writer Contract

on:
  pull_request:
    paths:
      - ".github/workflows/github-writer-contract.yml"
      - "package.json"
      - "skills/igapyon-github-writer/**"
  push:
    branches:
      - devel
    paths:
      - ".github/workflows/github-writer-contract.yml"
      - "package.json"
      - "skills/igapyon-github-writer/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run test:github-writer
      - run: npm run benchmark:github-writer
